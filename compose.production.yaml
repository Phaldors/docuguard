services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docuguard}
      POSTGRES_USER: ${POSTGRES_USER:-docuguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build: .
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    environment: &app_environment
      DOCUGUARD_ENVIRONMENT: production
      DOCUGUARD_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docuguard}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-docuguard}
      DOCUGUARD_DOCUMENT_STORAGE_PATH: /app/data/documents
      DOCUGUARD_OPENAI_API_KEY: ${DOCUGUARD_OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      <<: *app_environment
      DOCUGUARD_RUN_MIGRATIONS: "false"
    ports:
      - "${DOCUGUARD_PORT:-8000}:8000"
    volumes:
      - documents_data:/app/data/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
  documents_data:
