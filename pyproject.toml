[project]
name = "docuguard"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "openai>=2.26.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "datasets>=5.0.1",
    "httpx2>=2.13.1",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.9",
]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["I001", "UP007", "UP035"]
